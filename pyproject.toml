[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dissmodel-abm"
version = "0.2.0"
description = "TerraME-style agent-based modeling for DisSModel: agents, societies and placement on a raster cellular space"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sérgio Souza Costa", email = "sergio.costa@ufma.br" },
]
keywords = ["agent-based modeling", "DisSModel", "TerraME", "spatial dynamic modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "dissmodel>=0.6.6",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
viz = [
    "matplotlib",
    "streamlit",
]

[project.urls]
Homepage = "https://github.com/DisSModel/dissmodel-abm"
Repository = "https://github.com/DisSModel/dissmodel-abm"
Changelog = "https://github.com/DisSModel/dissmodel-abm/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: compares the logo models with TerraME runs (tests/goldens; about 20 s)",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "dissmodel_abm",
    "dissmodel_abm.core",
    "dissmodel_abm.models",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Model code follows the Lua originals line by line and relies on cells that
# exist (agent.cell, cs.get(x, y) inside the space). Optional checks stay on
# in the core.
[[tool.mypy.overrides]]
module = "dissmodel_abm.models.*"
disable_error_code = ["union-attr", "arg-type"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]
